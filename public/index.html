<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Token to MetaMask</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #instructions {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Add Your GCC Token to MetaMask</h1>
  <button id="addTokenButton">Add GCC Token</button>
  <div id="instructions">
    <p>Click the button above to add the GCC token to your MetaMask wallet.</p>
    <p>You will be prompted to connect your MetaMask wallet and approve the addition of the token.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
