name: Moltbook Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: read

concurrency:
  group: moltbook-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run bounded GoldCondorHerald heartbeat
        run: |
          node - <<'NODE'
          const response = await fetch(
            'https://gcc-opportunity-herald.onrender.com/heartbeat',
            {
              headers: {
                'Accept': 'application/json',
                'User-Agent': 'goldcondorherald-heartbeat-scheduler/1.0'
              },
              signal: AbortSignal.timeout(60000),
            }
          );
          const body = await response.text();
          console.log(body);
          if (!response.ok) process.exit(1);
          NODE
