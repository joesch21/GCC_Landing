name: Run Moltbook Heartbeat Once

on:
  push:
    branches:
      - ops/run-heartbeat-once-20260919

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run bounded GoldCondorHerald heartbeat
        run: |
          node - <<'NODE'
          const response = await fetch(
            'https://gcc-opportunity-herald.onrender.com/heartbeat',
            {
              headers: {
                'Accept': 'application/json',
                'User-Agent': 'goldcondorherald-heartbeat-manual/1.0'
              },
              signal: AbortSignal.timeout(60000),
            }
          );
          const body = await response.text();
          console.log(body);
          if (!response.ok) process.exit(1);
          NODE
